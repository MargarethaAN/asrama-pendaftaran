<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pendaftaran - Data Keluarga</title>
    <link rel="stylesheet" href="../css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .form-section {
            background: white;
            border-radius: 24px;
            padding: 28px;
            margin-bottom: 24px;
            border: 1px solid #e2e8f0;
        }
        .form-actions {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            margin-top: 24px;
        }
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 20px 0;
            padding: 16px;
            background: #f8fafc;
            border-radius: 12px;
        }
        .alert-fixed {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 2000;
            padding: 14px 20px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 500;
            animation: slideIn 0.3s ease;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1);
        }
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        .alert-success {
            background: #d1fae5;
            color: #065f46;
            border-left: 4px solid #10b981;
        }
        .alert-error {
            background: #fee2e2;
            color: #991b1b;
            border-left: 4px solid #ef4444;
        }
    </style>
</head>
<body>
    <div class="sidebar-layout">
        <div class="sidebar">
            <div class="logo">🏡 St. Teresa Dorm</div>
            <nav>
                <a href="dashboard.html">📊 Dashboard</a>
                <a href="pendaftaran-data-diri.html" class="active">📝 Pendaftaran</a>
                <a href="ketersediaan-kamar.html">🛏️ Ketersediaan Kamar</a>
                <a href="dokumen.html">📄 Dokumen</a>
                <a href="pembayaran.html">💳 Pembayaran</a>
                <a href="status-pendaftaran.html">📌 Status</a>
                <a href="booking-confirmation.html">✅ Konfirmasi</a>
                <a href="#" id="logoutBtn">🚪 Keluar</a>
            </nav>
        </div>
        
        <div class="main-content">
            <h1>👨‍👩‍👧 Data Keluarga</h1>
            <p>Informasi orang tua dan saudara kandung.</p>
            
            <div class="progress-steps">
                <div class="step completed"><div class="step-number">✓</div><div class="step-label">Data Diri</div></div>
                <div class="step active"><div class="step-number">2</div><div class="step-label">Data Keluarga</div></div>
                <div class="step"><div class="step-number">3</div><div class="step-label">Syarat & Ketentuan</div></div>
            </div>
            
            <form id="formKeluarga">
                <div class="form-section">
                    <h3>👨 Ayah</h3>
                    <div class="form-row">
                        <div class="form-group"><label>Nama Ayah</label><input type="text" id="nama_ayah" placeholder="Nama lengkap ayah"></div>
                        <div class="form-group"><label>Pekerjaan Ayah</label><input type="text" id="pekerjaan_ayah" placeholder="Pekerjaan ayah"></div>
                    </div>
                    <div class="form-group"><label>No. HP Ayah</label><input type="tel" id="no_hp_ayah" placeholder="Nomor telepon ayah"></div>
                </div>
                
                <div class="form-section">
                    <h3>👩 Ibu</h3>
                    <div class="form-row">
                        <div class="form-group"><label>Nama Ibu</label><input type="text" id="nama_ibu" placeholder="Nama lengkap ibu"></div>
                        <div class="form-group"><label>Pekerjaan Ibu</label><input type="text" id="pekerjaan_ibu" placeholder="Pekerjaan ibu"></div>
                    </div>
                    <div class="form-group"><label>No. HP Ibu</label><input type="tel" id="no_hp_ibu" placeholder="Nomor telepon ibu"></div>
                </div>
                
                <div class="form-section">
                    <h3>👥 Saudara Kandung</h3>
                    <div class="form-group"><label>Jumlah Saudara Kandung</label><input type="number" id="jumlah_saudara" min="0" value="0"></div>
                </div>
                
                <div class="checkbox-group">
                    <input type="checkbox" id="setuju" required>
                    <label style="margin:0; font-weight:normal;">Saya menyatakan bahwa data yang diisi adalah benar dan dapat dipertanggungjawabkan.</label>
                </div>
                
                <div class="form-actions">
                    <button type="button" onclick="window.location.href='pendaftaran-data-diri.html'" class="btn-secondary">← Kembali</button>
                    <button type="submit" class="btn-primary">Lanjutkan →</button>
                </div>
            </form>
        </div>
    </div>

    <script src="../js/main.js"></script>
    <script>
        // BASE_URL sudah dari main.js, jangan deklarasi ulang
        
        function showAlertLocal(message, type) {
            const oldAlert = document.querySelector('.alert-fixed');
            if (oldAlert) oldAlert.remove();
            
            const alertDiv = document.createElement('div');
            alertDiv.className = `alert-fixed alert-${type === 'success' ? 'success' : 'error'}`;
            alertDiv.innerHTML = `${type === 'success' ? '✅' : '❌'} ${message}`;
            document.body.appendChild(alertDiv);
            
            setTimeout(() => {
                alertDiv.style.opacity = '0';
                setTimeout(() => alertDiv.remove(), 300);
            }, 3000);
        }
        
        async function loadExistingData() {
            try {
                const response = await fetch(BASE_URL + 'get_pendaftar.php');
                const result = await response.json();
                if (result.success && result.data) {
                    const data = result.data;
                    if (data.nama_ayah) document.getElementById('nama_ayah').value = data.nama_ayah || '';
                    if (data.pekerjaan_ayah) document.getElementById('pekerjaan_ayah').value = data.pekerjaan_ayah || '';
                    if (data.no_hp_ayah) document.getElementById('no_hp_ayah').value = data.no_hp_ayah || '';
                    if (data.nama_ibu) document.getElementById('nama_ibu').value = data.nama_ibu || '';
                    if (data.pekerjaan_ibu) document.getElementById('pekerjaan_ibu').value = data.pekerjaan_ibu || '';
                    if (data.no_hp_ibu) document.getElementById('no_hp_ibu').value = data.no_hp_ibu || '';
                    if (data.jumlah_saudara) document.getElementById('jumlah_saudara').value = data.jumlah_saudara || 0;
                }
            } catch (error) {
                console.error('Error loading data:', error);
            }
        }
        
        async function saveDataKeluarga() {
            let existingData = {};
            try {
                const response = await fetch(BASE_URL + 'get_pendaftar.php');
                const result = await response.json();
                if (result.success && result.data) {
                    existingData = result.data;
                }
            } catch (error) {}
            
            const formData = {
                nim: existingData.nim || '',
                nama_lengkap: existingData.nama_lengkap || '',
                nama_panggilan: existingData.nama_panggilan || '',
                prodi: existingData.prodi || '',
                fakultas: existingData.fakultas || '',
                no_hp: existingData.no_hp || '',
                alamat_asal: existingData.alamat_asal || '',
                alamat_semarang: existingData.alamat_semarang || '',
                agama: existingData.agama || '',
                asal_sekolah: existingData.asal_sekolah || '',
                tempat_lahir: existingData.tempat_lahir || '',
                tanggal_lahir: existingData.tanggal_lahir || '',
                sifat_positif: existingData.sifat_positif || '',
                sifat_negatif: existingData.sifat_negatif || '',
                bakat: existingData.bakat || '',
                alasan_masuk: existingData.alasan_masuk_asrama || '',
                nama_ayah: document.getElementById('nama_ayah').value,
                pekerjaan_ayah: document.getElementById('pekerjaan_ayah').value,
                no_hp_ayah: document.getElementById('no_hp_ayah').value,
                nama_ibu: document.getElementById('nama_ibu').value,
                pekerjaan_ibu: document.getElementById('pekerjaan_ibu').value,
                no_hp_ibu: document.getElementById('no_hp_ibu').value,
                jumlah_saudara: document.getElementById('jumlah_saudara').value
            };
            
            try {
                const response = await fetch(BASE_URL + 'save_pendaftaran.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(formData)
                });
                const result = await response.json();
                
                if (result.success) {
                    showAlertLocal('Data keluarga berhasil disimpan!', 'success');
                    setTimeout(() => {
                        window.location.href = 'pendaftaran-syarat.html';
                    }, 1000);
                } else {
                    showAlertLocal(result.message, 'error');
                }
            } catch (error) {
                showAlertLocal('Gagal menyimpan data: ' + error.message, 'error');
            }
        }
        
        document.getElementById('formKeluarga').addEventListener('submit', function(e) {
            e.preventDefault();
            if (!document.getElementById('setuju').checked) {
                showAlertLocal('Harap centang pernyataan persetujuan data', 'error');
                return;
            }
            saveDataKeluarga();
        });
        
        loadExistingData();
        
        document.getElementById('logoutBtn').addEventListener('click', function(e) {
            e.preventDefault();
            window.location.href = '../index.html';
        });
    </script>
</body>
</html>
