<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Tinjauan Berkas Mahasiswa</title>
    <link rel="stylesheet" href="../css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .info-card {
            background: white;
            border-radius: 24px;
            padding: 28px;
            margin-bottom: 24px;
            border: 1px solid #e2e8f0;
        }
        .info-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 16px;
        }
        .info-header h3 {
            font-size: 20px;
            color: #1a2e3a;
        }
        .status-badge-large {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 500;
        }
        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .info-item {
            background: #f8fafc;
            padding: 16px;
            border-radius: 16px;
        }
        .info-label {
            font-size: 12px;
            color: #64748b;
            margin-bottom: 6px;
        }
        .info-value {
            font-size: 16px;
            font-weight: 600;
            color: #1a2e3a;
        }
        .action-buttons {
            display: flex;
            gap: 16px;
            margin-top: 24px;
            flex-wrap: wrap;
        }
        .btn-preview {
            background: #e2e8f0;
            color: #1a2e3a;
            padding: 5px 12px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
        }
        .btn-preview:hover {
            background: #cbd5e1;
        }
        .alert-fixed {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 2000;
            padding: 14px 20px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 500;
            animation: slideIn 0.3s ease;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1);
        }
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        .alert-success {
            background: #d1fae5;
            color: #065f46;
            border-left: 4px solid #10b981;
        }
        .alert-error {
            background: #fee2e2;
            color: #991b1b;
            border-left: 4px solid #ef4444;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: white;
            border-radius: 24px;
            padding: 24px;
            width: 90%;
            max-width: 500px;
            text-align: center;
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: #64748b;
        }
    </style>
</head>
<body>
    <div class="sidebar-layout">
        <div class="sidebar">
            <div class="logo">🏡 Admin Asrama</div>
            <nav>
                <a href="admin-dashboard.html">📊 Dashboard</a>
                <a href="admin-verifikasi-pendaftaran.html">📝 Verifikasi Pendaftaran</a>
                <a href="admin-verifikasi-pembayaran.html">💰 Verifikasi Pembayaran</a>
                <a href="admin-manajemen-kamar.html">🛏️ Manajemen Kamar</a>
                <a href="admin-data-penghuni.html" class="active">👥 Data Penghuni</a>
                <a href="admin-konfirmasi-keluar.html">🚪 Konfirmasi Keluar</a>
                <a href="admin-laporan.html">📄 Laporan & Rekap</a>
                <a href="admin-syarat-ketentuan.html">📜 Syarat & Ketentuan</a>
                <a href="admin-pencarian.html">🔍 Pencarian Data</a>
                <a href="#" id="logoutBtn">🚪 Keluar</a>
            </nav>
        </div>
        
        <div class="main-content">
            <h1>📋 Tinjauan Berkas Mahasiswa</h1>
            
            <div id="contentContainer">
                <div class="loading">Memuat数据...</div>
            </div>
        </div>
    </div>

    <!-- Modal Preview Berkas -->
    <div id="previewModal" class="modal">
        <div class="modal-content">
            <h3 id="previewTitle">Preview Berkas</h3>
            <div id="previewContent"></div>
            <button onclick="closePreviewModal()" class="btn-primary" style="margin-top: 20px;">Tutup</button>
        </div>
    </div>

    <script src="../js/main.js"></script>
    <script>
        // BASE_URL sudah dari main.js, jangan deklarasi ulang
        let currentIdPendaftar = null;
        
        function showAlertLocal(message, type) {
            const oldAlert = document.querySelector('.alert-fixed');
            if (oldAlert) oldAlert.remove();
            
            const alertDiv = document.createElement('div');
            alertDiv.className = `alert-fixed alert-${type === 'success' ? 'success' : 'error'}`;
            alertDiv.innerHTML = `${type === 'success' ? '✅' : '❌'} ${message}`;
            document.body.appendChild(alertDiv);
            
            setTimeout(() => {
                alertDiv.style.opacity = '0';
                setTimeout(() => alertDiv.remove(), 300);
            }, 3000);
        }
        
        function getUrlParameter(name) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(name);
        }
        
        async function loadData() {
            const idPendaftar = getUrlParameter('id');
            if (!idPendaftar) {
                document.getElementById('contentContainer').innerHTML = '<div class="info-card"><p style="color:red;">ID pendaftar tidak ditemukan</p><button onclick="history.back()" class="btn-secondary">Kembali</button></div>';
                return;
            }
            currentIdPendaftar = idPendaftar;
            
            try {
                const resPendaftar = await fetch(BASE_URL + 'get_pendaftar_by_id.php?id=' + idPendaftar);
                const resultPendaftar = await resPendaftar.json();
                
                const resDokumen = await fetch(BASE_URL + 'get_dokumen_admin.php?id_pendaftar=' + idPendaftar);
                const resultDokumen = await resDokumen.json();
                
                renderContent(resultPendaftar.data, resultDokumen.data);
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('contentContainer').innerHTML = '<div class="info-card"><p>Gagal memuat数据</p><button onclick="history.back()" class="btn-secondary">Kembali</button></div>';
            }
        }
        
        function hitungMasaHunian(tglMasuk) {
            if (!tglMasuk) return 'Belum ditentukan';
            const masuk = new Date(tglMasuk);
            const sekarang = new Date();
            let tahun = sekarang.getFullYear() - masuk.getFullYear();
            let bulan = sekarang.getMonth() - masuk.getMonth();
            if (bulan < 0) {
                tahun--;
                bulan += 12;
            }
            let teks = '';
            if (tahun > 0) teks += `${tahun} tahun `;
            if (bulan > 0) teks += `${bulan} bulan`;
            if (tahun === 0 && bulan === 0) teks = 'Kurang dari 1 bulan';
            return teks;
        }
        
        function renderContent(pendaftar, dokumen) {
            if (!pendaftar) {
                document.getElementById('contentContainer').innerHTML = '<div class="info-card"><p>Data tidak ditemukan</p><button onclick="history.back()" class="btn-secondary">Kembali</button></div>';
                return;
            }
            
            const masaHunian = hitungMasaHunian(pendaftar.tanggal_masuk_asrama);
            const statusHunian = pendaftar.status_keluar === 'aktif' ? 'Aktif' : 'Nonaktif';
            const statusClass = pendaftar.status_keluar === 'aktif' ? 'status-success' : 'status-danger';
            
            const expectedDocs = ['ktm', 'kk', 'foto', 'rekomendasi', 'transkrip'];
            const docNames = {
                'ktm': 'Scan KTM',
                'kk': 'Scan Kartu Keluarga',
                'foto': 'Pas Foto',
                'rekomendasi': 'Surat Rekomendasi',
                'transkrip': 'Transkrip Nilai'
            };
            
            const uploadedDocs = {};
            dokumen.forEach(doc => {
                uploadedDocs[doc.jenis_dokumen] = doc;
            });
            
            let dokumenHtml = '<div class="table-container"><table class="data-table"><thead><tr><th>Jenis Dokumen</th><th>Status</th><th>Aksi</th></tr></thead><tbody>';
            
            for (const docKey of expectedDocs) {
                const doc = uploadedDocs[docKey];
                const status = doc ? (doc.status_verifikasi === 'diverifikasi' ? 'Terverifikasi' : 'Menunggu') : 'Belum Upload';
                const statClass = doc ? (doc.status_verifikasi === 'diverifikasi' ? 'status-success' : 'status-warning') : 'status-danger';
                const action = doc ? `<button onclick="previewBerkas('${doc.file_path}', '${docNames[docKey]}')" class="btn-preview">👁️ Lihat</button>` : '-';
                
                dokumenHtml += `
                    <tr>
                        <td>${docNames[docKey]}</td>
                        <td><span class="status-badge ${statClass}">${status}</span></td>
                        <td>${action}</td>
                    </tr>
                `;
            }
            dokumenHtml += '</tbody></table></div>';
            
            const html = `
                <div class="info-card">
                    <div class="info-header">
                        <h3>${escapeHtml(pendaftar.nama_lengkap || '-')} - ${pendaftar.nim || '-'}</h3>
                        <span class="status-badge-large ${statusClass}">${statusHunian}</span>
                    </div>
                    
                    <div class="info-grid">
                        <div class="info-item"><div class="info-label">NIM</div><div class="info-value">${pendaftar.nim || '-'}</div></div>
                        <div class="info-item"><div class="info-label">Nama Lengkap</div><div class="info-value">${escapeHtml(pendaftar.nama_lengkap || '-')}</div></div>
                        <div class="info-item"><div class="info-label">Program Studi</div><div class="info-value">${escapeHtml(pendaftar.prodi || '-')}</div></div>
                        <div class="info-item"><div class="info-label">No. Handphone</div><div class="info-value">${pendaftar.no_hp || '-'}</div></div>
                    </div>
                    
                    <div class="info-grid">
                        <div class="info-item"><div class="info-label">Tanggal Masuk Asrama</div><div class="info-value">${pendaftar.tanggal_masuk_asrama || 'Belum ditentukan'}</div></div>
                        <div class="info-item"><div class="info-label">Masa Hunian</div><div class="info-value">${masaHunian}</div></div>
                        <div class="info-item"><div class="info-label">Kamar</div><div class="info-value">${pendaftar.nomor_kamar || 'Belum ditentukan'}</div></div>
                    </div>
                    
                    <hr style="margin: 20px 0;">
                    
                    <h4 style="margin-bottom: 16px;">📎 Berkas Persyaratan</h4>
                    ${dokumenHtml}
                    
                    <div class="action-buttons">
                        ${pendaftar.status_keluar === 'aktif' ? `<button onclick="konfirmasiKeluar()" class="btn-primary">🚪 Konfirmasi Keluar Asrama</button>` : ''}
                        <button onclick="history.back()" class="btn-secondary">← Kembali</button>
                    </div>
                </div>
            `;
            
            document.getElementById('contentContainer').innerHTML = html;
        }
        
        function previewBerkas(filePath, nama) {
            const isImage = filePath && filePath.match(/\.(jpg|jpeg|png)$/i);
            let previewContent = '';
            
            if (!filePath) {
                previewContent = '<p>File tidak tersedia</p>';
            } else if (isImage) {
                previewContent = `<img src="../${filePath}" style="max-width:100%; max-height:400px; border-radius:12px;" onerror="this.src='https://placehold.co/400x300/ccc/white?text=Gambar+tidak+ditemukan'">`;
            } else {
                previewContent = `
                    <div style="padding: 30px; background: #f1f5f9; border-radius: 12px;">
                        <div style="font-size: 48px; margin-bottom: 16px;">📄</div>
                        <p>File: ${filePath.split('/').pop()}</p>
                        <a href="../${filePath}" target="_blank" style="color: #2c7a4d;">📥 Download file</a>
                    </div>
                `;
            }
            
            document.getElementById('previewTitle').innerHTML = `Preview: ${nama}`;
            document.getElementById('previewContent').innerHTML = previewContent;
            document.getElementById('previewModal').style.display = 'flex';
        }
        
        function closePreviewModal() {
            document.getElementById('previewModal').style.display = 'none';
        }
        
        function konfirmasiKeluar() {
            window.location.href = `admin-konfirmasi-keluar.html?id=${currentIdPendaftar}`;
        }
        
        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        loadData();
        
        document.getElementById('logoutBtn').addEventListener('click', function(e) {
            e.preventDefault();
            window.location.href = '../index.html';
        });
    </script>
</body>
</html>
