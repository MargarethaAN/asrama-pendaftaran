<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Konfirmasi Booking - St. Teresa Dorm</title>
    <link rel="stylesheet" href="../css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="../css/responsive.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: #F8FAFC; display: flex; color: #1E293B; overflow-x: hidden; }

        .sidebar { width: 260px; height: 100vh; position: fixed; left: 0; top: 0; background: #fff; border-right: 1px solid #EDF2F7; display: flex; flex-direction: column; justify-content: space-between; box-shadow: 2px 0 12px rgba(0,0,0,.03); z-index: 999; }
        .sidebar-top { padding: 20px 15px; }
        .logo { display: flex; align-items: center; gap: 10px; margin-bottom: 30px; padding-left: 8px; }
        .logo-icon { width: 34px; height: 34px; background: #6BCB3D; border-radius: 10px; display: flex; justify-content: center; align-items: center; font-size: 18px; color: white; }
        .logo-text { font-size: 20px; font-weight: 800; color: #6BCB3D; line-height: 1.1; }
        .nav-menu { display: flex; flex-direction: column; gap: 6px; }
        .nav-item { display: flex; align-items: center; gap: 12px; padding: 12px 15px; text-decoration: none; font-size: 14px; font-weight: 600; border-radius: 12px; color: #475569; transition: .25s; }
        .nav-item:hover { background: #F1F5F9; color: #111827; }
        .nav-item.active { background: #6BCB3D; color: white; }
        .sidebar-footer { padding: 18px 15px; border-top: 1px solid #EEF2F7; }
        .profile-widget { display: flex; align-items: center; gap: 12px; padding: 10px; background: #F8FAFC; border-radius: 12px; margin-bottom: 15px; }
        .avatar { width: 42px; height: 42px; border-radius: 50%; background: #E2E8F0; display: flex; align-items: center; justify-content: center; font-size: 20px; }
        .profile-info h4 { font-size: 14px; margin-bottom: 2px; }
        .profile-info p { font-size: 12px; color: #64748B; }
        .nav-item i { width: 22px; font-size: 17px; text-align: center; }

        .main-content { margin-left: 260px; width: calc(100% - 260px); padding: 30px; background: #f8fafc; min-height: 100vh; }

        .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 28px; padding-bottom: 18px; border-bottom: 1px solid #E5E7EB; flex-wrap: wrap; gap: 12px; }
        .page-title h2 { margin: 0; font-size: 28px; font-weight: 700; color: #69C33B; }
        .page-title p { margin-top: 4px; font-size: 14px; color: #7B7B7B; }
        .notif-btn { width: 44px; height: 44px; border-radius: 50%; border: 1px solid #E5E7EB; background: #fff; cursor: pointer; font-size: 18px; }

        .confirm-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 25px; align-items: flex-start; }

        .booking-progress { background: #fff; border: 1px solid #ECECEC; border-radius: 20px; padding: 24px 30px 14px; }
        .booking-progress-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; padding-bottom: 18px; border-bottom: 1px solid #ECECEC; }
        .booking-progress-header h3 { margin: 0; font-size: 18px; font-weight: 700; }
        .booking-progress-header h3 i { color: #72C341; }
        .booking-progress-header small { font-size: 11px; color: #888; font-style: italic; }

        .progress-item { display: flex; gap: 18px; position: relative; margin-bottom: 15px; }
        .progress-item:not(:last-child)::before { content: ""; position: absolute; left: 15px; top: 35px; width: 2px; height: 58px; background: #E5E7EB; }
        .progress-dot { width: 34px; height: 34px; border-radius: 50%; flex-shrink: 0; }
        .progress-dot.done { background: #72C341; position: relative; }
        .progress-dot.done::before { content: "\f00c"; font-family: "Font Awesome 6 Free"; font-weight: 900; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #fff; font-size: 14px; }
        .progress-dot.current { background: #fff; border: 2px solid #72C341; }
        .progress-dot.wait { background: #E5E7EB; }
        .progress-title { font-size: 14px; font-weight: 700; margin-bottom: 8px; }
        .progress-status { display: inline-block; padding: 5px 14px; border-radius: 20px; font-size: 12px; font-weight: 600; }
        .progress-status.done { background: #0b943b; color: #F3F4F6; }
        .progress-status.current { background: #FEF3C7; color: #B45309; }
        .progress-status.wait { background: #F3F4F6; color: #6B7280; }

        .booking-card { background: #fff; border: 2px solid #72C341; border-radius: 20px; overflow: hidden; }
        .booking-header { padding: 14px 18px; border-bottom: 1px solid #ECECEC; display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 700; color: #5AA531; }
        .booking-header i { color: #72C341; }
        .booking-body { padding: 20px; }

        .room-box { width: 100%; max-width: 250px; margin: 15px auto; border: 1px solid #ECECEC; border-radius: 16px; padding: 18px; text-align: center; }
        .room-box small { font-size: 12px; font-weight: 600; color: #666; }
        .room-box h2 { margin: 0; font-size: 16px; }

        .timer-header { display: flex; justify-content: space-between; align-items: center; margin-top: 20px; }
        .timer-title { font-size: 12px; font-weight: 600; }
        .timer-percent { font-size: 14px; font-weight: 600; color: #4CAF50; }
        .timer { font-size: 32px; font-weight: 700; color: #1F2937; margin: 12px 0; }
        .timer span { font-size: 15px; font-weight: 500; color: #6B7280; }
        .progress-bar { width: 100%; height: 8px; background: #DCEFD1; border-radius: 999px; overflow: hidden; margin-top: 12px; }
        .progress-fill { width: 90%; height: 100%; background: #72C341; border-radius: 999px; }
        .deadline { background: #F3F4F6; border-radius: 10px; padding: 12px; text-align: center; margin: 16px 0; font-size: 13px; }

        .warning-box { border: 1px dashed #E5E7EB; border-radius: 14px; padding: 18px; margin-bottom: 14px; }
        .warning-box h4 { margin: 0 0 12px; color: #DC2626; font-size: 16px; }
        .warning-item { display: flex; align-items: flex-start; gap: 10px; margin-top: 12px; font-size: 14px; line-height: 1.6; }
        .icon-circle { font-weight: 700; font-size: 15px; margin-top: 2px; }
        .icon-circle.danger { color: #DC2626; }
        .icon-circle.success { color: #15803D; }

        .btn-green { width: 100%; padding: 14px; border: none; border-radius: 12px; background: #388509; color: #fff; font-weight: 700; cursor: pointer; margin-bottom: 12px; transition: background 0.2s; }
        .btn-green:hover { background: #4CAF50; }
        .btn-red { width: 100%; padding: 14px; border: none; border-radius: 12px; background: #DC2626; color: #fff; font-weight: 700; cursor: pointer; transition: background 0.2s; }
        .btn-red:hover { background: #B91C1C; }

        .confirmation-card { background: white; border-radius: 24px; padding: 40px; text-align: center; max-width: 500px; margin: 0 auto; border: 1px solid #e2e8f0; }
        .success-icon { font-size: 64px; margin-bottom: 16px; }
        .confirmation-card h2 { margin-bottom: 12px; }
        .action-buttons { display: flex; gap: 12px; justify-content: center; margin-top: 20px; flex-wrap: wrap; }
        .btn-primary { background: #6BCB3D; color: white; border: none; padding: 12px 24px; border-radius: 10px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
        .btn-primary:hover { background: #1a5d3a; }

        .alert-fixed { position: fixed; top: 20px; right: 20px; z-index: 2000; padding: 14px 20px; border-radius: 12px; font-size: 14px; font-weight: 500; animation: slideIn 0.3s ease; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1); }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        .alert-success { background: #d1fae5; color: #065f46; border-left: 4px solid #10b981; }
        .alert-error { background: #fee2e2; color: #991b1b; border-left: 4px solid #ef4444; }

        .loading { text-align: center; padding: 60px; color: #64748b; }

        @media (max-width: 992px) { .confirm-layout { grid-template-columns: 1fr; } }
        @media (max-width: 768px) { .sidebar { display: none; } .main-content { margin-left: 0; width: 100%; padding: 20px; } .page-header { flex-direction: column; align-items: flex-start; } .page-title h2 { font-size: 22px; } }
    </style>
</head>
<body>

    <button class="sidebar-toggle" onclick="toggleSidebar()">
        <i class="fa-solid fa-bars"></i>
    </button>
    <div class="sidebar-backdrop" onclick="toggleSidebar()"></div>
    <div class="sidebar">
        <div class="sidebar-top">
            <div class="logo">
                <div class="logo-icon"><i class="fa-solid fa-graduation-cap"></i></div>
                <div class="logo-text">St. Teresa Dorm</div>
            </div>
            <nav class="nav-menu">
                <a href="dashboard.html" class="nav-item"><i class="fa-solid fa-chart-line"></i><span>Dashboard</span></a>
                <a href="pendaftaran-data-diri.html" class="nav-item"><i class="fa-regular fa-file-lines"></i><span>Pendaftaran</span></a>
                <a href="ketersediaan-kamar.html" class="nav-item"><i class="fa-solid fa-bed"></i><span>Ketersediaan Kamar</span></a>
                <a href="pembayaran.html" class="nav-item"><i class="fa-regular fa-credit-card"></i><span>Pembayaran</span></a>
                <a href="dokumen.html" class="nav-item"><i class="fa-regular fa-folder-open"></i><span>Dokumen</span></a>
                <a href="status-pendaftaran.html" class="nav-item"><i class="fa-regular fa-circle-check"></i><span>Status Pendaftaran</span></a>
                <a href="booking-confirmation.html" class="nav-item active"><i class="fa-regular fa-handshake"></i><span>Konfirmasi Booking</span></a>
            </nav>
        </div>
        <div class="sidebar-footer">
            <div class="profile-widget">
                <div class="avatar"><i class="fa-solid fa-user"></i></div>
                <div class="profile-info">
                    <h4 id="profileName">Maria Angelina</h4>
                    <p>Pendaftar</p>
                </div>
            </div>
            <a href="#" class="nav-item" id="logoutBtn" style="color:#ef4444;"><i class="fa-solid fa-right-from-bracket"></i><span>Logout</span></a>
        </div>
    </div>

    <div class="main-content">
        <div class="page-header">
            <div class="page-title">
                <h2>🤝 Konfirmasi Booking Kamar</h2>
            <p>Konfirmasi pemilihan kamar sebelum batas waktu berakhir</p>
            </div>
            <button class="notif-btn"><i class="fa-regular fa-bell"></i></button>
        </div>

        <div id="contentContainer">
            <div class="loading">Memuat data...</div>
        </div>
    </div>

    <script src="../js/main.js"></script>
    <script>
        let timeLeft = 47 * 3600 + 23 * 60 + 45;
        let timerInterval = null;

        async function getUserData() {
            try {
                if (typeof BASE_URL === 'undefined') {
                    document.getElementById('profileName').innerHTML = 'Pengguna';
                    return;
                }
                const response = await fetch(BASE_URL + 'check_session.php');
                const result = await response.json();
                if (result.logged_in) {
                    document.getElementById('profileName').innerHTML = result.nama || 'Pengguna';
                }
            } catch (error) { console.error('Error:', error); }
        }

        function showAlertLocal(message, type) {
            const old = document.querySelector('.alert-fixed');
            if (old) old.remove();
            const div = document.createElement('div');
            div.className = `alert-fixed alert-${type === 'success' ? 'success' : 'error'}`;
            div.innerHTML = `${type === 'success' ? '✅' : '❌'} ${message}`;
            document.body.appendChild(div);
            setTimeout(() => { div.style.opacity = '0'; setTimeout(() => div.remove(), 300); }, 3000);
        }

        function updateTimer() {
            if (timeLeft <= 0) {
                if (timerInterval) clearInterval(timerInterval);
                const el = document.getElementById('timer');
                if (el) el.innerHTML = '00:00:00';
                showAlertLocal('Waktu konfirmasi habis! Booking dibatalkan.', 'error');
                setTimeout(() => { window.location.href = 'dashboard.html'; }, 2000);
                return;
            }
            const hours = Math.floor(timeLeft / 3600);
            const minutes = Math.floor((timeLeft % 3600) / 60);
            const seconds = timeLeft % 60;
            const el = document.getElementById('timer');
            if (el) {
                el.innerHTML = `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
            }
            timeLeft--;
        }

        function renderBookingConfirmation(data) {
            const kamar = data.nomor_kamar || '25';
            const lantai = data.lantai || '2';

            document.getElementById('contentContainer').innerHTML = `
                <div class="confirm-layout">
                    <div class="booking-progress">
                        <div class="booking-progress-header">
                            <h3><i class="fa-regular fa-clock"></i> Alur Progress Pendaftaran</h3>
                            <small>Terakhir diperbarui: Hari ini, 14:20 WIB</small>
                        </div>
                        <div class="progress-item">
                            <div class="progress-dot done"></div>
                            <div><div class="progress-title">1. Mengisi Data Diri</div><span class="progress-status done">Selesai</span></div>
                        </div>
                        <div class="progress-item">
                            <div class="progress-dot done"></div>
                            <div><div class="progress-title">2. Upload Dokumen</div><span class="progress-status done">Selesai</span></div>
                        </div>
                        <div class="progress-item">
                            <div class="progress-dot done"></div>
                            <div><div class="progress-title">3. Verifikasi Data</div><span class="progress-status done">Selesai</span></div>
                        </div>
                        <div class="progress-item">
                            <div class="progress-dot done"></div>
                            <div><div class="progress-title">4. Pemilihan Kamar</div><span class="progress-status done">Selesai</span></div>
                        </div>
                        <div class="progress-item">
                            <div class="progress-dot wait"></div>
                            <div><div class="progress-title">5. Pembayaran & Verifikasi akhir</div><span class="progress-status wait">Belum Tersedia</span></div>
                        </div>
                    </div>

                    <div class="booking-card">
                        <div class="booking-header"><i class="fa-solid fa-circle-check"></i> KONFIRMASI BOOKING - WAJIB KONFIRMASI DALAM 2 HARI!</div>
                        <div class="booking-body">
                            <div class="room-box">
                                <small>KAMAR YANG TELAH DIPILIH</small>
                                <h2>KAMAR ${kamar} (Lantai ${lantai})</h2>
                            </div>
                            <div class="timer-header">
                                <div class="timer-title">Sisa Waktu Konfirmasi</div>
                                <div class="timer-percent">90% Tersisa</div>
                            </div>
                            <div class="timer" id="timer">47:23:12</div>
                            <div class="progress-bar"><div class="progress-fill"></div></div>
                            <div class="deadline"><strong>Batas akhir: Sabtu, 2 Mei 2025, 14:20 WIB</strong></div>
                            <div class="warning-box">
                                <h4>⚠ PERHATIAN & KEBIJAKAN</h4>
                                <div class="warning-item">
                                    <span class="icon-circle danger">✕</span>
                                    <span>Jika <b>TIDAK mengonfirmasi</b> dalam 2 hari, kamar akan <b>Dibatalkan</b> secara otomatis oleh sistem.</span>
                                </div>
                                <div class="warning-item">
                                    <span class="icon-circle success">✓</span>
                                    <span>Setelah konfirmasi, Anda silakan melakukan pembayaran dan menunggu verifikasi akhir.</span>
                                </div>
                            </div>
                            <button class="btn-green" onclick="confirmBooking()">KONFIRMASI JADI - LANJUT BAYAR</button>
                            <button class="btn-red" onclick="cancelBooking()">BATALKAN PENDAFTARAN</button>
                        </div>
                    </div>
                </div>
            `;

            timeLeft = 47 * 3600 + 23 * 60 + 45;
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(updateTimer, 1000);
        }

        function renderMenungguVerifikasi() {
            document.getElementById('contentContainer').innerHTML = `
                <div class="confirmation-card">
                    <div class="success-icon">⏳</div>
                    <h2>Menunggu Verifikasi</h2>
                    <p style="color: #64748b;">Pendaftaran Anda sedang dalam proses verifikasi oleh admin.</p>
                    <div class="action-buttons">
                        <button class="btn-primary" onclick="location.href='status-pendaftaran.html'">Lihat Status</button>
                    </div>
                </div>
            `;
        }

        function renderBelumAdaPendaftaran() {
            document.getElementById('contentContainer').innerHTML = `
                <div class="confirmation-card">
                    <div class="success-icon">📝</div>
                    <h2>Belum Ada Pendaftaran</h2>
                    <p style="color:#64748b">Anda belum mengisi formulir pendaftaran.</p>
                    <div class="action-buttons">
                        <button class="btn-primary" onclick="location.href='pendaftaran-data-diri.html'">Mulai Pendaftaran</button>
                    </div>
                </div>
            `;
        }

        function renderBookingTidakTersedia() {
            document.getElementById('contentContainer').innerHTML = `
                <div class="confirmation-card">
                    <div class="success-icon">⚠️</div>
                    <h2>Booking Belum Tersedia</h2>
                    <p style="color: #64748b;">Pendaftaran Anda belum mencapai tahap konfirmasi booking. Silakan cek status pendaftaran Anda.</p>
                    <div class="action-buttons">
                        <button class="btn-primary" onclick="location.href='status-pendaftaran.html'">Lihat Status</button>
                    </div>
                </div>
            `;
        }

        async function loadData() {
            try {
                if (typeof BASE_URL === 'undefined') {
                    showAlertLocal('BASE_URL tidak terdefinisi!', 'error');
                    renderBelumAdaPendaftaran();
                    return;
                }

                const response = await fetch(BASE_URL + 'get_status.php');
                const result = await response.json();

                if (result.success && result.data) {
                    const data = result.data;
                    const status = data.status_pendaftaran;

                    // SINKRON: Gunakan data.is_kamar_terpilih yang sama dengan status-pendaftaran
                    if (status === 'diterima' && data.is_kamar_terpilih) {
                        renderBookingConfirmation(data);
                    } else if (status === 'diterima' && !data.is_kamar_terpilih) {
                        renderBookingTidakTersedia();
                    } else if (status === 'menunggu_verifikasi') {
                        renderMenungguVerifikasi();
                    } else {
                        renderBelumAdaPendaftaran();
                    }
                } else {
                    renderBelumAdaPendaftaran();
                }
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('contentContainer').innerHTML = `
                    <div class="confirmation-card">
                        <div class="success-icon">❌</div>
                        <h2>Gagal Memuat Data</h2>
                        <p style="color:#64748b;">Terjadi kesalahan saat memuat data.</p>
                        <div class="action-buttons">
                            <button class="btn-primary" onclick="location.reload()">Coba Lagi</button>
                        </div>
                    </div>
                `;
            }
        }

        function confirmBooking() {
            showAlertLocal('Booking berhasil dikonfirmasi! Silakan lanjutkan ke pembayaran.', 'success');
            setTimeout(() => { window.location.href = 'pembayaran.html'; }, 1500);
        }

        function cancelBooking() {
            if (confirm('Apakah Anda yakin ingin membatalkan pendaftaran?')) {
                showAlertLocal('Pendaftaran dibatalkan.', 'error');
                setTimeout(() => { window.location.href = 'dashboard.html'; }, 1500);
            }
        }

        document.getElementById('logoutBtn').addEventListener('click', function(e) {
            e.preventDefault();
            window.location.href = '../index.html';
        });

        document.addEventListener('DOMContentLoaded', function() {
            setTimeout(async function() {
                await getUserData();
                await loadData();
            }, 100);
        });
    </script>
</body>
</html>
