<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Konfirmasi Booking - Asrama Putri</title>
    <link rel="stylesheet" href="../css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        .page-header{
            display:flex;
            justify-content:space-between;
            align-items:center;
            margin-bottom:28px;
            padding-bottom:18px;
        }
        .page-title h2{
            margin:0;
            font-size:32px;
            font-weight:700;
            color:#222;
        }
        .page-title p{
            margin-top:8px;
            font-size:15px;
            color:#7B7B7B;
        }
        .notif-btn{
            width:44px;
            height:44px;
            border-radius:50%;
            border:1px solid #E5E7EB;
            background:#fff;
            cursor:pointer;
            font-size:18px;
        }
        .confirm-layout{
            display:grid;
            grid-template-columns:1fr 1fr;
            gap:25px;
            align-items:flex-start;
        }
        .booking-layout{
            display:grid;
            grid-template-columns:1.1fr 1fr;
            gap:32px;
            align-items:start;
        }
        .booking-progress{
            background:#fff;
            border:1px solid #ECECEC;
            border-radius:20px;
            padding:24px 30px 14px;
        }
        .booking-progress-header{
            display:flex;
            justify-content:space-between;
            align-items:center;
            margin-bottom:24px;
            padding-bottom:18px;
            border-bottom:1px solid #ECECEC;
        }
        .booking-progress-header h3{
            margin:0;
            font-size:18px;
            font-weight:700;
        }
        .booking-progress-header h3 i{
            color:#72C341;
        }
        .booking-progress-header small{
            font-size:11px;
            color:#888;
            font-style:italic;
        }
        .booking-left{
            background:#fff;
            border:1px solid #ECECEC;
            border-radius:20px;
            padding:26px;
        }
        .booking-right{
            background:#fff;
            border:2px solid #6FC23E;
            border-radius:20px;
            overflow:hidden;
        }
        .booking-header{
            padding:14px 18px;
            border-bottom:1px solid #ECECEC;
            display:flex;
            align-items:center;
            gap:10px;
            font-size:14px;
            font-weight:700;
            color:#5AA531;
        }
        .booking-header i{
            color:#72C341;
        }
        .booking-body{
            padding:8px 12px;
        }
        .btn-green,
        .btn-red{
            display:block;
            width:fit-content;
            margin-left:auto;
            margin-right:auto;
            padding:12px 24px;
            border:none;
            border-radius:12px;
            font-size:12px;
            font-weight:600;
            cursor:pointer;
            transition:.25s;
        }
        .btn-green{
            background:#388509;
            color:#fff;
            margin-top:18px;
            margin-bottom:12px;
        }
        .btn-green:hover{
            background:#63b332;
        }
        .btn-red{
            background:#ea231f;
            color:#fff;
        }
        .btn-red:hover{
            background:#d32f2f;
        }
        .booking-header h3{
            margin:0;
            font-size:18px;
            font-weight:700;
        }
        .booking-header h3 i{
            color:#6FC23E;
        }
        .booking-header small{
            font-size:13px;
            color:#777;
            font-style:italic;
        }
        .booking-card{
            background:#fff;
            border:2px solid #72C341;
            border-radius:20px;
            overflow:hidden;
            position:relative;
            top:-20px;
        }
        .progress-item{
            display:flex;
            gap:18px;
            position:relative;
            margin-bottom:15px;
        }

        .progress-item:not(:last-child)::before{
            content:"";
            position:absolute;
            left:15px;
            top:35px;
            width:2px;
            height:58px;
            background:#E5E7EB;
        }

        .progress-dot{
            width:34px;
            height:34px;
            border-radius:50%;
            flex-shrink:0;
        }

        .progress-dot.done{
            background:#72C341;
            position:relative;
        }
        .progress-dot.done::before{
            content:"\f00c";
            font-family:"Font Awesome 6 Free";
            font-weight:900;
            position:absolute;
            top:50%;
            left:50%;
            transform:translate(-50%,-50%);
            width:18px;
            height:18px;
            border-radius:50%;
            border:2px solid #fff;   
            background:transparent;   
            color:#fff;          
            display:flex;
            justify-content:center;
            align-items:center;
            font-size:9px;
            box-sizing:border-box;
        }
        .progress-dot.current{
            background:#fff;
            border:2px solid #72C341;
        }

        .progress-dot.wait{
            background:#E5E7EB;
        }

        .progress-title{
            font-size:14px;
            font-weight:700;
            margin-bottom:8px;
        }

        .progress-status{
            display:inline-block;
            padding:5px 14px;
            border-radius:20px;
            font-size:12px;
            font-weight:600;
        }

        .progress-status.done{
            background:#0b943b;
            color:#F3F4F6;
        }

        .progress-status.current{
            background:#FEF3C7;
            color:#B45309;
        }

        .progress-status.wait{
            background:#F3F4F6;
            color:#6B7280;
        }
        .timeline-item{
            display:flex;
            gap:20px;
            margin-bottom:28px;
            position:relative;
        }
        .timeline-item:not(:last-child)::before{
            content:"";
            position:absolute;
            left:18px;
            top:40px;
            width:2px;
            height:58px;
            background:#E5E7EB;
        }
        .timeline-icon{
            width:36px;
            height:36px;
            min-width:36px;
            border-radius:50%;
            position:relative;
            z-index:2;
            border:2px solid #D1D5DB;
        }
        .timeline-icon.done{
            background:#6FC23E;
            border-color:#6FC23E;
            color:#fff;
            display:flex;
            align-items:center;
            justify-content:center;
        }
        .timeline-icon.waiting{
            background:#fff;
            border-color:#D1D5DB;
        }
        .timeline-icon.disable{
            background:#E5E7EB;
            border-color:#E5E7EB;
        }
        .timeline-content h4{
            margin:0;
            font-size:16px;
            font-weight:700;
        }
        .status-badge{
            display:inline-block;
            margin-top:8px;
            padding:5px 14px;
            border-radius:999px;
            font-size:12px;
            font-weight:600;
        }
        .status-badge.done{
            background:#DCFCE7;
            color:#15803D;
        }
        .status-badge.wait{
            background:#FEF3C7;
            color:#B45309;
        }
        .status-badge.disable{
            background:#F3F4F6;
            color:#6B7280;
        }
        .right-top{
            padding:18px 24px;
            border-bottom:1px solid #E5E7EB;
            background:#F8FFF3;
        }
        .right-top h3{
            margin:0;
            color:#5AAE2F;
            font-size:18px;
            font-weight:700;
        }
        .right-body{
            padding:24px;
        }
        .room-box{
            width:250px;
            margin:15px auto;
            border:1px solid #ECECEC;
            border-radius:16px;
            padding:18px;
            text-align:center;
        }
        .room-box small{
            font-size:12px;
            font-weight:600;
            color:#666;
        }
        .room-box h2{
            margin:0;
            font-size:16px;
        }
        .timer-title{
            font-size:12px;
            font-weight:600;
        }
        .timer-row{
            display:flex;
            justify-content:space-between;
            align-items:flex-end;
        }
        .timer{
            font-size:32px;
            font-weight:700;
            color:#1F2937;
            margin:12px 0;
        }
        .timer span{
            font-size:15px;
            font-weight:500;
            color:#6B7280;
            margin-right:8px;
        }
        .timer-header{
            display:flex;
            justify-content:space-between;
            align-items:center;
            margin-top:20px;
        }
        .timer-percent{
            font-size:14px;
            font-weight:600;
            color:#4CAF50;
        }
        .progress-bar{
            width:100%;
            height:8px;
            background:#DCEFD1;
            border-radius:999px;
            overflow:hidden;
            margin-top:12px;
        }
        .progress-fill{
        width:90%;
        height:100%;
        background:#72C341;
        border-radius:999px;
    }
        .progress{
            width:100%;
            height:12px;
            background:#F3F4F6;
            border-radius:999px;
            overflow:hidden;
            margin:18px 0;
        }
        .progress div{
            width:90%;
            height:100%;
            background:#6FC23E;
        }
        .deadline{
            background:#F3F4F6;
            border-radius:10px;
            padding:12px;
            text-align:center;
            margin-bottom:20px;
            font-size:13px;
        }
        .warning-box{
            border:1px dashed #E5E7EB;
            border-radius:14px;
            padding:18px;
            margin-bottom:14px 0;
        }
        .warning-item{
            display:flex;
            align-items:flex-start;
            gap:10px;
            margin-top:12px;
            font-size:14px;
            line-height:1.6;
        }
        .icon-circle{
            font-weight:700;
            font-size:15px;
            line-height:1;
            margin-top:2px;
        }
        .icon-circle.danger{
            color:#DC2626;
        }
        .warning-box h4{
            margin:0 0 12px;
            color:#DC2626;
            font-size:16px;
        }
        .warning-box p{
            font-size:13px;
            line-height:1.6;
        }
        .btn-confirm{
            width:100%;
            padding:16px;
            border:none;
            border-radius:12px;
            background:#6FC23E;
            color:#fff;
            font-weight:700;
            cursor:pointer;
            margin-bottom:18px;
        }
        .btn-cancel{
            width:100%;
            padding:16px;
            border:none;
            border-radius:12px;
            background:#DC3F36;
            color:#fff;
            font-weight:700;
            cursor:pointer;
        }
        .loading{
            text-align:center;
            padding:60px;
        }
    </style>
</head>
<body>
    <div class="sidebar-layout">
        <div class="sidebar">
            <div class="logo">
                <div class="logo-circle">
                    <i class="fa-solid fa-graduation-cap"></i>
                </div>
                <span>St. Teresa Dorm</span>
            </div>
            <nav>
                <a href="dashboard.html">
                    <i class="fa-solid fa-table-columns"></i>
                    Dashboard
                </a>
                <a href="pendaftaran-data-diri.html">
                    <i class="fa-regular fa-file-lines"></i>
                    Pendaftaran
                </a>
                <a href="ketersediaan-kamar.html">
                    <i class="fa-solid fa-bed"></i>
                    Ketersediaan Kamar
                </a>
                <a href="pembayaran.html">
                    <i class="fa-regular fa-credit-card"></i>
                    Pembayaran
                </a>
                <a href="dokumen.html">
                    <i class="fa-regular fa-folder-open"></i>
                    Dokumen
                </a>
                <a href="status-pendaftaran.html"class="active">
                    <i class="fa-regular fa-circle-check"></i>
                    Status Pendaftaran
                </a>
            </nav>
            <div class="sidebar-footer">
                <div class="profile-card">
                    <img src="https://i.pravatar.cc/80?img=32" alt="profile">
                    <div>
                        <h4>Maria Angelina</h4>
                        <p>Pendaftar</p>
                    </div>
                </div>
                <button class="logout-btn" id="logoutBtn">
                    <i class="fa-solid fa-arrow-right-from-bracket"></i>
                    Logout
                </button>
            </div>
        </div>
        
        <div class="main-content">
            <div class="page-header">
                <div class="page-title">
                    <h2>Status Pendaftaran Saya</h2>
                </div>
                <button class="notif-btn">
                    🔔
                </button>
            </div>
            <div id="contentContainer">
                <div class="loading">
                    Memuat data...
                </div>
            </div>
        </div>

    <script src="../js/main.js"></script>
    <script>
        // BASE_URL sudah dari main.js, jangan deklarasi ulang
        let timeLeft = 47 * 3600 + 23 * 60 + 45;
        let timerInterval = null;
        
        function showAlertLocal(message, type) {
            const oldAlert = document.querySelector('.alert-fixed');
            if (oldAlert) oldAlert.remove();
            
            const alertDiv = document.createElement('div');
            alertDiv.className = `alert-fixed alert-${type === 'success' ? 'success' : 'error'}`;
            alertDiv.innerHTML = `${type === 'success' ? '✅' : '❌'} ${message}`;
            document.body.appendChild(alertDiv);
            
            setTimeout(() => {
                alertDiv.style.opacity = '0';
                setTimeout(() => alertDiv.remove(), 300);
            }, 3000);
        }
        
        function updateTimer() {
            if (timeLeft <= 0) {
                if (timerInterval) clearInterval(timerInterval);
                if (document.getElementById('timer')) {
                    document.getElementById('timer').innerHTML = '00:00:00';
                }
                showAlertLocal('Waktu konfirmasi habis! Booking dibatalkan.', 'error');
                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 2000);
                return;
            }
            
            const hours = Math.floor(timeLeft / 3600);
            const minutes = Math.floor((timeLeft % 3600) / 60);
            const seconds = timeLeft % 60;
            
            const timerEl = document.getElementById('timer');
            if (timerEl) {
                timerEl.innerHTML = `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
            }
            
            timeLeft--;
        }
        
        async function loadData() {
            try {
                const response = await fetch(BASE_URL + 'get_pendaftar.php');
                const result = await response.json();
                
                if (result.success && result.data) {
                    const data = result.data;
                    const status = data.status_pendaftaran;
                    
                    const kamarTawaran = data.nomor_kamar || '25';

                    if (status !== 'diterima') {
                        document.getElementById('contentContainer').innerHTML = `
                        <div class="confirm-layout">
                            <div class="booking-progress">
                                <div class="booking-progress-header">
                                    <h3>
                                        <i class="fa-regular fa-clock"></i>
                                        Alur Progress Pendaftaran
                                    </h3>
                                    <small>
                                        Terakhir diperbarui: Hari ini, 14:20 WIB
                                    </small>
                                </div>
                                <div class="progress-item">
                                    <div class="progress-dot done"></div>
                                    <div>
                                        <div class="progress-title">
                                            1. Mengisi Data Diri
                                        </div>
                                        <span class="progress-status done">
                                            Selesai
                                        </span>
                                    </div>
                                </div>

                                <div class="progress-item">
                                    <div class="progress-dot done"></div>
                                    <div>
                                        <div class="progress-title">
                                            2. Upload Dokumen
                                        </div>
                                        <span class="progress-status done">
                                            Selesai
                                        </span>
                                    </div>
                                </div>

                                <div class="progress-item">
                                    <div class="progress-dot done"></div>
                                    <div>
                                        <div class="progress-title">
                                            3. Verifikasi Data
                                        </div>
                                        <span class="progress-status done">
                                            Selesai
                                        </span>
                                    </div>
                                </div>

                                <div class="progress-item">
                                    <div class="progress-dot done"></div>
                                    <div>
                                        <div class="progress-title">
                                            4. Pemilihan Kamar
                                        </div>
                                        <span class="progress-status done">
                                            Selesai
                                        </span>
                                    </div>
                                </div>

                            <div class="progress-item">
                                    <div class="progress-dot wait"></div>
                                    <div>
                                        <div class="progress-title">
                                            5. Pembayaran & Verifikasi akhir
                                        </div>
                                        <span class="progress-status wait">
                                            Belum Tersedia
                                        </span>
                                    </div>
                                </div>
                            </div>

                            <div class="booking-card">
                                <div class="booking-header">
                                    <i class="fa-solid fa-circle-check"></i>
                                    KONFIRMASI BOOKING-WAJIB KONFIRMASI DALAM 2 HARI!
                                </div>
                                <div class="booking-body">

                                <div class="room-box">
                                    <small>KAMAR YANG TELAH DIPILIH</small>
                                    <h2>KAMAR 25 (Lantai 2)</h2>
                                </div>

                                <div class="timer-header">
                                <div class="timer-title">
                                    Sisa Waktu Konfirmasi
                                </div>

                                <div class="timer-percent">
                                    90% Tersisa
                                </div>
                            </div>
                                <div class="timer">
                                    47<span>Jam</span>23<span>Menit</span>12<span>Detik</span>
                                </div>

                                <div class="progress-bar">
                                    <div class="progress-fill"></div>
                                </div>

                                <div class="deadline">
                                    <strong>Batas akhir: Sabtu, 2 Mei 2025, 14:20 WIB</strong><br>
                                </div>

                                <div class="warning-box">
                                    <h4>⚠ PERHATIAN & KEBIJAKAN</h4>
                                    <div class="warning-item danger">
                                        <span class="icon-circle danger">✕</span>
                                        <span>
                                            Jika <b>TIDAK mengonfirmasi</b> dalam 2 hari,
                                            kamar akan <b>Dibatalkan</b> secara otomatis oleh sistem.
                                        </span>
                                    </div>
                                    <div class="warning-item success">
                                        <span class="icon-circle success">✓</span>
                                        <span>
                                            Setelah konfirmasi, Anda silakan melakukan pembayaran
                                            dan menunggu verifikasi akhir.
                                        </span>
                                    </div>
                                </div>

                                <button 
                                    class="btn-green" 
                                    onclick="confirmBooking()">
                                    KONFIRMASI JADI-LANJUT BAYAR
                                </button>
                                <button 
                                    class="btn-red" 
                                    onclick="cancelBooking()">
                                    BATALKAN PENDAFTARAN
                                </button> 
                                </div>
                            </div>
                        </div>
                        `;

                        timeLeft = 47 * 3600 + 23 * 60 + 45;
                        if (timerInterval) {
                            clearInterval(timerInterval);
                        }
                        timerInterval = setInterval(updateTimer, 1000);
                    } else {
                    document.getElementById('contentContainer').innerHTML = `
                        <div class="confirmation-card">
                            <div class="success-icon">
                                ⚠️
                                </div>
                                <h2>
                                    Booking Belum Tersedia
                                </h2>
                                <p style="color: #64748b;">
                                    Pendaftaran Anda masih dalam proses verifikasi.
                                </p>
                                <div class="action-buttons">
                                    <button 
                                    class="btn-primary"
                                    onclick="location.href='status-pendaftaran.html'">
                                    Lihat Status
                                </button>
                                </div>
                            </div>
                        `;
                    }

                    } else {
                    document.getElementById("contentContainer").innerHTML = `
                    <div class="confirmation-card">
                        <div class="success-icon">
                            📝
                        </div>
                        <h2>
                            Belum Ada Pendaftaran
                        </h2>
                        <p style="color:#64748b">
                            Anda belum mengisi formulir pendaftaran.
                        </p>
                        <div class="action-buttons">
                            <button
                                class="btn-primary"
                                onclick="location.href='pendaftaran-data-diri.html'">
                                Mulai Pendaftaran
                            </button>
                        </div>
                    </div>
                    `;
                }

            } catch (error) {
                console.error(error);
                document.getElementById("contentContainer").innerHTML = `
                <div class="confirmation-card">
                    <div class="success-icon">
                        ❌
                    </div>
                    <h2>
                        Gagal Memuat Data
                    </h2>
                    <p style="color:#64748b">
                        Terjadi kesalahan saat memuat data.
                    </p>
                    <div class="action-buttons">
                        <button
                            class="btn-primary"
                            onclick="location.reload()">
                            Coba Lagi
                        </button>
                    </div>
                </div>
                `;
            }
        }
        
        function confirmBooking() {
            showAlertLocal('Booking berhasil dikonfirmasi! Silakan lanjutkan ke pembayaran.', 'success');
            setTimeout(() => {
                window.location.href = 'pembayaran.html';
            }, 1500);
        }
        
        function cancelBooking() {
            if (confirm('Apakah Anda yakin ingin membatalkan pendaftaran?')) {
                showAlertLocal('Pendaftaran dibatalkan.', 'error');
                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 1500);
            }
        }
        
        loadData();
        
        document.getElementById('logoutBtn').addEventListener('click', function(e) {
            e.preventDefault();
            window.location.href = '../index.html';
        });
    </script>
</body>
</html>
