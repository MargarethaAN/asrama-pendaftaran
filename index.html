<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Pendaftaran Asrama Putri</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
        }

        /* Landing Container */
        .landing-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0a1e14 0%, #72D63F 50%, #72D63F 100%);
            position: relative;
            overflow: hidden;
        }
        
        /* Animated background bubbles */
        .landing-container::before {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            background: rgba(255,255,255,0.08);
            border-radius: 50%;
            bottom: -150px;
            left: -150px;
            animation: float 20s infinite ease-in-out;
        }
        
        .landing-container::after {
            content: '';
            position: absolute;
            width: 500px;
            height: 500px;
            background: rgba(255,255,255,0.05);
            border-radius: 50%;
            top: -250px;
            right: -250px;
            animation: float 15s infinite ease-in-out reverse;
        }
        
        @keyframes float {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(30px, 20px); }
        }
        
        /* Decorative floating icons */
        .decorative-icon {
            position: absolute;
            font-size: 50px;
            opacity: 0.12;
            pointer-events: none;
            animation: floatIcon 8s infinite ease-in-out;
        }
        
        @keyframes floatIcon {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(5deg); }
        }
        
        .decorative-icon-1 { top: 15%; left: 8%; animation-delay: 0s; }
        .decorative-icon-2 { bottom: 12%; right: 6%; animation-delay: 2s; }
        .decorative-icon-3 { top: 30%; right: 15%; animation-delay: 4s; font-size: 40px; }
        .decorative-icon-4 { bottom: 25%; left: 12%; animation-delay: 1s; font-size: 35px; }
        
        /* Main Card */
        .landing-card {
            background: rgba(255,255,255,0.98);
            border-radius: 40px;
            padding: 52px 48px;
            text-align: center;
            box-shadow: 0 30px 60px -20px rgba(0,0,0,0.4), 0 0 0 1px rgba(255,255,255,0.2);
            max-width: 520px;
            width: 90%;
            position: relative;
            z-index: 10;
            transition: all 0.4s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            backdrop-filter: blur(10px);
        }
        
        .landing-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 40px 70px -20px rgba(0,0,0,0.5);
        }
        
        /* Logo / Icon */
        .logo-icon {
            font-size: 64px;
            margin-bottom: 16px;
            display: inline-block;
            animation: bounce 2s infinite ease-in-out;
        }
        
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
        
        /* Title */
        .landing-card h1 {
            font-size: 32px;
            font-weight: 800;
            background: linear-gradient(135deg, #72D63F, #2c7a4d, #72D63F);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 12px;
            letter-spacing: -0.5px;
        }
        
        /* Subtitle */
        .landing-card p {
            color: #64748b;
            font-size: 15px;
            line-height: 1.7;
            margin-bottom: 36px;
        }
        
        .landing-card p strong {
            color: #2c7a4d;
            font-weight: 600;
        }
        
        /* Button */
        .btn-primary {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: linear-gradient(135deg, #72D63F, #72D63F);
            color: white;
            padding: 14px 40px;
            border-radius: 60px;
            text-decoration: none;
            font-weight: 600;
            font-size: 16px;
            transition: all 0.3s ease;
            box-shadow: 0 8px 20px rgba(44,122,77,0.3);
            border: none;
            cursor: pointer;
            width: 100%;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 28px rgba(44,122,77,0.4);
            background: linear-gradient(135deg, #1e5a3a, #2c7a4d);
        }
        
        .btn-primary:active {
            transform: translateY(1px);
        }
        
        /* Divider */
        .divider {
            display: flex;
            align-items: center;
            gap: 16px;
            margin: 28px 0 20px;
        }
        
        .divider-line {
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, transparent, #e2e8f0, transparent);
        }
        
        .divider-text {
            font-size: 12px;
            color: #94a3b8;
            font-weight: 500;
        }
        
        /* Demo Info */
        .demo-info {
            background: #f8fafc;
            border-radius: 20px;
            padding: 20px;
            margin-top: 8px;
        }
        
        .demo-title {
            font-size: 12px;
            font-weight: 700;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 14px;
        }
        
        .demo-accounts {
            display: flex;
            gap: 14px;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        .demo-item {
            background: white;
            padding: 10px 16px;
            border-radius: 14px;
            font-size: 11px;
            color: #334155;
            text-align: center;
            border: 1px solid #e2e8f0;
            transition: all 0.2s;
            flex: 1;
            min-width: 140px;
        }
        
        .demo-item:hover {
            border-color: #2c7a4d;
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.05);
        }
        
        .demo-item strong {
            color: #2c7a4d;
            display: block;
            margin-bottom: 6px;
            font-size: 12px;
        }
        
        .demo-item span {
            font-size: 10px;
            color: #94a3b8;
        }
        
        /* Footer note */
        .footer-note {
            margin-top: 20px;
            font-size: 11px;
            color: #94a3b8;
        }
        
        /* Responsive */
        @media (max-width: 480px) {
            .landing-card {
                padding: 36px 24px;
            }
            
            .landing-card h1 {
                font-size: 24px;
            }
            
            .landing-card p {
                font-size: 13px;
            }
            
            .demo-item {
                min-width: 120px;
                padding: 8px 12px;
            }
        }
    </style>
</head>
<body>
    <div class="landing-container">
        <!-- Decorative floating icons -->
        <div class="decorative-icon decorative-icon-1">🏠</div>
        <div class="decorative-icon decorative-icon-2">🌸</div>
        <div class="decorative-icon decorative-icon-3">📚</div>
        <div class="decorative-icon decorative-icon-4">✨</div>
        
        <div class="landing-card">
            <div class="logo-icon">🏠</div>
            <h1>Sistem Pendaftaran Asrama Putri</h1>
            <p>
                Dormitory <strong>"Teresa Avila"</strong><br>
                Universitas Katolik Soegijapranata Semarang
            </p>
            
            <a href="pages/login.html" class="btn-primary">
                <span>→</span> Masuk ke Sistem
            </a>
        </div>
    </div>
</body>
</html>
